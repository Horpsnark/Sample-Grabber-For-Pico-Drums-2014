function stampHTML(){const s=S.stamps[S.stamps.length-1];if(!s||s.i!==S.i)return "";return `<div class="stampbox"><div class="stamp">${s.y}<br><b>${s.v}</b><br>${s.d||"ADMIT ONE"}</div><div class="muted">Stamped ${s.all.length} songs in your stamp book${s.nw.length?`, <b class="good">${s.nw.length} new</b>`:""}.</div><div>${s.all.map(n=>`<span class="chip ${s.nw.includes(n)?"on":""}">${s.nw.includes(n)?"★ ":""}${n}</span>`).join("")}</div></div>`}

function book(){const n=Object.keys(S.heard).length;return `<div class="card"><h2>📖 Songbook ${n}/${SONGS.length}${n>=SONGS.length?" 🏆 COMPLETE!":""}</h2><div class="muted">Second goal: hear every song (originals and covers). ⭐ rare songs show up more when your vibes are high.</div><div class="prog"><i style="width:${n/SONGS.length*100}%"></i></div><div>${SONGS.map(s=>`<span class="chip ${S.heard[s.n]?"on":""}">${S.heard[s.n]?s.n:(s.t==3?"⭐ ???":"???")}</span>`).join("")}</div></div>`}
const IT={bracelet:{n:"Hemp bracelets",e:"📿",c:2,p:6,d:30,step:5,note:"cheap to make, steady sellers"},
dye:{n:"Tie-dyes",e:"🌈",c:9,p:22,d:10,step:2,note:"the classic, big margins"},
food:{n:"Grilled cheese burritos",e:"🌯",c:2.5,p:6,d:28,step:5,note:"spoils after tonight"},
party:{n:"Wholesale “party favors”",e:"🍄",c:12,p:30,d:9,step:2,note:"big money, and the heat is real"},tape:{n:"Bootleg tapes",e:"📼",c:1,p:8,d:12,step:5,nb:1,note:"from taper tickets"}};
const KEYS=Object.keys(IT),ST=[{l:"Cheap",m:.8,e:1.5},{l:"Fair",m:1,e:1},{l:"Gouge",m:1.35,e:.5}];
const R=(a,b)=>a+Math.random()*(b-a),$=n=>"$"+(Math.abs(n)<10?n.toFixed(2):Math.round(n).toLocaleString());
let S;
function venue(i){const m={};KEYS.forEach(k=>m[k]=R(.6,1.5));return{i,m,crowd:R(.8,1.4),ticket:Math.round(2+(V[i][2]-1965)*.9)}}
function init(){S={i:0,cash:80,vibes:0,shows:0,inv:{bracelet:0,dye:0,food:0,party:0,tape:0},buy:{bracelet:0,dye:0,food:0,party:0,tape:0},st:{bracelet:1,dye:1,food:1,party:1,tape:1},ph:"shop",log:[],free:false,v:venue(0),why:"",heard:{},stamps:[],last:{all:[],nw:[]},skip:0,baby:0,van:100,up:{},tix:0,saved:0,cr:{}};draw()}
const cost=()=>KEYS.reduce((t,k)=>t+S.buy[k]*IT[k].c*inf(),0);
function chg(k,d){const n=Math.max(0,S.buy[k]+d*IT[k].step);S.buy[k]=n;if(cost()>S.cash)S.buy[k]-=d*IT[k].step;draw()}
function hot(k){const x=S.v.m[k];return x>1.25?"🔥 hot here":x<.8?"🥶 slow here":"steady"}
function stats(){const e=(S.cash+" ");return `<div class="stats"><div class="stat"><b>${$(S.cash)}</b><span>Cash</span></div><div class="stat"><b>${S.shows}</b><span>Shows</span></div><div class="stat"><b>${Math.round(S.vibes)}</b><span>Vibes</span></div><div class="stat"><b>${Object.keys(S.heard).length}/${SONGS.length}</b><span>Songs</span></div><div class="stat"><b>${V[S.i][2]}</b><span>Year</span></div></div><div class="prog"><i style="width:${S.i/V.length*100}%"></i></div>`}
function head(){const v=V[S.i];return `<div class="card"><h2>${v[2]} · ${v[0]}</h2><div class="muted">${v[1]} · 🚐 Van ${Math.round(S.van)}% · Stop ${S.i+1}/${V.length} · Ticket ${$(S.v.ticket)}${REAL[v[2]+"|"+v[0]]?" · ✅ real show: "+REAL[v[2]+"|"+v[0]].d:""} · Crowd ${S.v.crowd>1.15?"huge":S.v.crowd<.95?"light":"solid"}</div></div>`}
function draw(){let h=stats();
if(S.ph==="end")return end();
h+=scene()+head();
if(S.ph==="shop"){h+=`<div class="card"><h2>Stock up</h2><div class="muted">Spend your cash on supplies. Unsold goods carry over, except burritos.</div>`;
KEYS.forEach(k=>{const t=IT[k];if(t.nb)return;h+=`<div class="row"><div class="nm">${t.e} <b>${t.n}</b><small>${$(t.c*inf())} each · ${t.note} · ${hot(k)} · have ${S.inv[k]}</small></div><div class="qty"><button class="sm" onclick="chg('${k}',-1)">−</button><b>${S.buy[k]}</b><button class="sm" onclick="chg('${k}',1)">+</button></div></div>`});
h+=`<div class="muted" style="margin-top:8px">Spending: <b>${$(cost())}</b></div><button class="alt" onclick="tune()" ${S.cash-cost()<c$(40)||S.van>=100?"disabled":""}>🔧 Tune up the van (+30%) · ${$(c$(40))}</button>${craftBtns()}${upBtns()}<button class="go" onclick="toLot()">Head to Shakedown Street →</button></div>`}
else if(S.ph==="emerg"){h+=emHTML()}else if(S.ph==="lot"){h+=`<div class="card"><h2>Set your prices</h2><div class="muted">Cheap sells more, gouging sells less. Fair is the vibe.</div>`;
let any=false;KEYS.forEach(k=>{if(!S.inv[k])return;any=true;const t=IT[k];h+=`<div class="row"><div class="nm">${t.e} <b>${t.n}</b><small>${S.inv[k]} in stock · base ${$(t.p*inf())}</small></div><div class="seg">${(k==="tape"?[...ST,{l:"Keep"},{l:"Trade"}]:ST).map((s,j)=>`<button class="${S.st[k]===j?"on":""}" onclick="S.st['${k}']=${j};draw()">${s.l}</button>`).join("")}</div></div>`});
if(!any)h+=`<p class="muted">Nothing to sell. You’re just hanging in the lot.</p>`;
h+=`<button class="go" onclick="vend()">Open the blanket</button></div>`}
else if(S.ph==="result"){h+=`<div class="card log"><h2>Shakedown report</h2>${S.log.map(l=>`<p>${l}</p>`).join("")}<button class="go" onclick="S.ph='show';draw()">Toward the gate →</button></div>`}
else if(S.ph==="show"&&S.skip){h+=`<div class="card"><h2>Stuck</h2><div class="big">🚫</div><p class="bad">Your emergency means you can’t make tonight’s show.</p><button class="go" onclick="S.skip=0;skip()">Stay in the lot</button></div>`}else if(S.ph==="show"){const can=S.cash>=S.v.ticket;h+=`<div class="card"><h2>Showtime</h2><div class="big">🎸⚡🌹</div>`;
if(S.free){h+=`<p class="good">You’ve got a spare ticket in hand. Magic.</p><button class="go" onclick="enter(0)">Go in and dance</button>`}
else{h+=`<p class="muted">Ticket is ${$(S.v.ticket)}. You have ${$(S.cash)}.</p>${can?`<button class="go" onclick="enter(1)">Buy ticket and go in</button>`:`<p class="bad">Not enough for a ticket.</p>`}<button class="alt" onclick="miracle()">Stand with a finger up: “I need a miracle”</button>`}
h+=`<button class="alt" onclick="taper()" ${S.cash<Math.round(S.v.ticket*1.5)?"disabled":""}>📼 Buy a taper ticket and record the show (${$(Math.round(S.v.ticket*1.5))})</button><button class="alt" onclick="skip()">Skip the show, stay in the lot</button></div>`}
else if(S.ph==="after"){h+=`<div class="card log"><h2>Night’s over</h2>${stampHTML()}${S.log.map(l=>`<p>${l}</p>`).join("")}<button class="go" onclick="drive()">${S.i===V.length-1?"Finish the tour":"Drive to "+V[S.i+1][1]} →</button></div>`}
document.getElementById("app").innerHTML=h+stampBook()+book()+peersCard();pres();peersDraw()}
function toLot(){const c=cost();S.cash-=c;KEYS.forEach(k=>{S.inv[k]+=S.buy[k];S.buy[k]=0});S.ph="lot";draw()}
function vend(){const L=[];let ev={mult:{},t:""};const r=Math.random();
if(r<.18){ev={mult:{food:.5,dye:.5},t:"🌧️ Rain rolls through. Dye and burritos slow way down."}}
else if(r<.34){ev={mult:{bracelet:1.3,dye:1.3,food:1.3,party:1.3},t:"✨ Word is it’s a sold-out special one. The lot is packed."}}
else if(r<.48){ev={mult:{bracelet:.6},t:"😤 A rival vendor undercuts you on bracelets."}}
else if(r<.60){ev={mult:{food:1.6},t:"🌮 The munchies hit hard. Burrito line around the block."}}
else if(r<.70){ev={mult:{},t:"🤝 A kind Head trades you a spare ticket for a handshake and a story.",free:true}}
if(V[S.i][2]<1980)L.push("🅿️ Shakedown Street doesn’t exist yet. It grew up in the early 1980s, so the lot is just a few friends hanging out.");if(ev.t)L.push(`<span class="ev">${ev.t}</span>`);if(ev.free)S.free=true;
let rev=0;KEYS.forEach(k=>{const s=S.inv[k];if(!s)return;if(k==="tape"&&S.st[k]>=3){if(S.st[k]===4){const v=Math.ceil(s/5)*2;S.vibes+=v;S.inv[k]=0;L.push(`📼 You trade all ${s} tapes with fellow Heads, the old-fashioned way. <span class="good">+${v} vibes</span>`)}else L.push(`📼 You keep your ${s} tapes for later.`);return}const t=IT[k],st=ST[S.st[k]];
const dem=t.d*S.v.m[k]*S.v.crowd*st.e*(1+S.vibes/250)*(ev.mult[k]||1)*lotf()*R(.8,1.2);
const sold=Math.min(s,Math.round(dem)),got=sold*t.p*inf()*st.m;S.inv[k]-=sold;rev+=got;if(k==="tape"&&sold>0)S.vibes=Math.max(0,S.vibes-2);
L.push(`${t.e} ${t.n}: sold <b>${sold}</b> of ${s} for <span class="good">${$(got)}</span>`)});
if(S.inv.food>0){L.push(`🗑️ ${S.inv.food} burritos went cold and got tossed.`);S.inv.food=0}
S.cash+=rev;
if(S.inv.party>0||(rev>0&&false)){const bust=.12+S.st.party*.06+(S.v.i/60);if(Math.random()<bust){const fine=Math.min(S.cash,60+S.v.i*5);S.cash-=fine;L.push(`<span class="bad">🚓 Cops sweep the lot. You lose your remaining party stock and pay a ${$(fine)} fine.</span>`);bustSound();S.inv.party=0;S.vibes-=8}}
S.vibes=Math.max(0,S.vibes+2);
L.push(`Total today: <b>${$(rev)}</b>`);S.log=L;S.ph="result";draw()}
function enter(pay){if(pay)S.cash-=S.v.ticket;S.free=false;S.shows++;S.vibes+=10;S.log=playSet();const rv=REAL[V[S.i][2]+"|"+V[S.i][0]];S.stamps.push({i:S.i,v:V[S.i][0],y:V[S.i][2],all:S.last.all,nw:S.last.nw,d:rv?rv.d:"",real:!!rv});if(S.stamps.length%5===0){if(S.stamps.length%10===0){S.tix=(S.tix||0)+1;S.log.push("🎁 Stamp bonus ("+S.stamps.length+" stamps): a spare ticket for a future show!")}else{S.vibes+=15;S.log.push("🎁 Stamp bonus ("+S.stamps.length+" stamps): +15 vibes!")}}S.ph="after";draw()}
function miracle(){const p=.25+S.vibes/200;if(Math.random()<p){S.free=true;S.log=[];draw()}else{S.vibes=Math.max(0,S.vibes-2);S.log=[`🙏 No miracle tonight. You listen from the lot instead.`];S.ph="after";draw()}}
function skip(){S.free=false;S.log=[`🔥 You skip the show and hang by the fire, hearing the music drift out of the venue. Cash saved.`];S.ph="after";draw()}
function drive(){if(S.i===V.length-1){S.ph="end";return draw()}
const f=inf()*(S.baby?1.6:1),gas=Math.round(R(15,30)*f),camp=Math.round(10*f);const L=[];if(S.cash<gas+camp){let x=0;KEYS.forEach(k=>{x+=S.inv[k]*IT[k].c*f*.5;S.inv[k]=0});if(x>0){S.cash+=x;L.push(`💸 Short on gas money, so you sold your leftover stock at half price for ${$(x)}.`)}}S.cash-=gas+camp;L.push(`⛽ Gas ${$(gas)} + camp food ${$(camp)}.`);
const r=Math.random();
if(r<.18){const b=Math.min(S.cash,Math.round(R(30,60)*inf()));S.cash-=b;L.push(`<span class="bad">🔧 The van breaks down outside town. Repairs: ${$(b)}.</span>`)}
else if(r<.36){S.cash+=20;L.push(`<span class="good">🧑‍🎤 A hitchhiker chips in $20 for gas and plays you a tape.</span>`)}
if(S.cash<0){S.cash=0;S.why="You ran out of gas money and got stranded on the road.";S.ph="end";return draw()}
S.i++;S.v=venue(S.i);S.ph="shop";S.log=L;if(V[S.i][2]>V[S.i-1][2])L.push("🎉 New year on the road: "+V[S.i][2]+". Years survived: "+(V[S.i][2]-1964)+".");S.van=Math.max(5,S.van-R(4,10)*(S.up.engine?.6:1));if(S.tix>0&&!S.free){S.tix--;S.free=true;L.push("🎟️ You pull a spare ticket from your stamp bonus for tonight.")}if(Math.random()<.3+(100-S.van)/300){S.em=pickEm();S.ph="emerg";if(S.em.t==="Busted!")bustSound()}S.buy={bracelet:0,dye:0,food:0,party:0,tape:0};S.cr={};
draw();const a=document.getElementById("app");a.insertAdjacentHTML("beforeend",`<div class="card log"><h2>On the road</h2>${L.map(l=>`<p>${l}</p>`).join("")}</div>`)}
function end(){const inv=KEYS.reduce((t,k)=>t+S.inv[k]*IT[k].c,0);const score=Math.round((V[S.i][2]-1964)*100+Object.keys(S.heard).length*5+S.shows*5+S.cash/20);
const stops=S.i+1,yrs=V[S.i][2]-1964;if(!S.saved){S.saved=1;S.score=score;saveLocal(score,yrs)}let best=yrs;try{best=Math.max(yrs,+localStorage.getItem("gdbestyrs")||0);localStorage.setItem("gdbestyrs",best)}catch(e){}const pc=Object.keys(S.heard).length/SONGS.length;const grade=yrs>=31?"Ultimate Deadhead":yrs>=22?"Legend of the lot":yrs>=12?"Seasoned tour rat":yrs>=5?"Solid Deadhead":"Still learning the lot";
document.getElementById("app").innerHTML=`<div class="card" style="text-align:center"><div class="big">🌹💀⚡</div><h2>${S.why||(yrs>=31?"🏆 You toured all the way to 1995!":"The tour is over")}</h2><p class="muted">Years on tour: <b>${yrs}/31</b> (1965–${V[S.i][2]}) · Longest tour: <b>${best} yrs</b><br>Stops: <b>${stops}/${V.length}</b> · Stamps: <b>${S.stamps.length}</b>${pc>=1?" · 🏆 Songbook complete!":""}<br>Shows seen: <b>${S.shows}</b> · Cash: <b>${$(S.cash)}</b> · Vibes: <b>${Math.round(S.vibes)}</b></p><h2 class="good">${grade}</h2><p class="muted">Score: ${score}</p><button class="go" onclick="init()">Hit the road again</button></div>`+shareCard()+scoreCard()+stampBook()+book()+peersCard();pres();peersDraw();loadBoard()}
(function(){try{const q=new URLSearchParams(location.search).get("challenge");if(q){const d=JSON.parse(decodeURIComponent(escape(atob(q))));if(d&&typeof d.n==="string"&&typeof d.s==="number"&&typeof d.y==="number"){const a=localScores();if(!a.some(x=>x.n===d.n&&x.s===d.s&&x.y===d.y)){a.push({n:d.n.slice(0,14),s:Math.round(d.s),y:Math.round(d.y),source:"challenge"});a.sort((p,q)=>q.s-p.s);localStorage.setItem("gdscores",JSON.stringify(a.slice(0,10)))}}}}catch(e){}try{const raw=localStorage.getItem("gdsave_v1");if(raw){const p=JSON.parse(raw);if(p&&typeof p.i==="number"&&p.inv&&p.v){S=p;draw();return}}}catch(e){}init()})();
</script></body></html>
